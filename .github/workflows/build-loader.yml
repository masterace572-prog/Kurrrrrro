name: Build loader APK

on:
  workflow_dispatch:
    inputs:
      target_sdk:
        description: 'targetSdk (34 = Android 14 behaviour level, 28 = legacy)'
        required: false
        default: '34'
  push:
    paths:
      - 'loader/**'
      - '.github/workflows/build-loader.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: loader
    env:
      TARGET_SDK: ${{ github.event.inputs.target_sdk || '34' }}
      # permissions a game loader must never ship — if one of these survives the
      # manifest merge the build is reported as a problem
      BLOCKED_PATTERNS: 'CAMERA RECORD_AUDIO LOCATION CONTACTS SMS MMS WAP_PUSH CALL_LOG CALL_PHONE ANSWER_PHONE_CALLS PHONE_STATE PHONE_NUMBERS OUTGOING_CALLS CALENDAR BODY_SENSORS ACTIVITY_RECOGNITION BLUETOOTH NFC UWB_RANGING MEDIA_AUDIO MEDIA_IMAGES MEDIA_VIDEO TRANSMIT_IR BIOMETRIC FINGERPRINT _ACCOUNTS AUTHENTICATE_ACCOUNTS USE_CREDENTIALS WALLPAPER BOOT_COMPLETED EXACT_ALARM SOCIAL_STREAM USER_DICTIONARY AD_ID DUMP'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;24.0.8215888 cmake;3.22.1'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('loader/**/*.gradle', 'loader/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Show the endpoint compiled into the APK
        run: |
          grep -n 'define PANEL_BASE_URL' app/src/main/jni/main.cpp
          echo "::notice title=endpoint::$(grep -m1 'define PANEL_BASE_URL' app/src/main/jni/main.cpp | cut -d'"' -f2)"
          echo "::notice title=targetSdk::building with targetSdk=$TARGET_SDK"

      - name: Build debug APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace -PxloxTargetSdk=$TARGET_SDK 2>&1 | tee /tmp/gradle.log

      # The job log is not always readable (it is a zip behind a signed URL), so
      # every interesting line is re-published as a check-run annotation.
      - name: Explain a failed build
        if: failure()
        run: |
          if [ ! -s /tmp/gradle.log ]; then
            echo "::error title=build::gradle produced no output (failed before the build step)"
            exit 0
          fi
          HITS=$(grep -nE 'error:|e: |FAILURE: Build failed|Could not resolve|Caused by:|> Task .* FAILED|Execution failed|What went wrong' /tmp/gradle.log | tail -8)
          if [ -z "$HITS" ]; then
            HITS=$(grep -v '^[[:space:]]*$' /tmp/gradle.log | tail -8)
          fi
          echo "$HITS" | while IFS= read -r line; do
            echo "::error title=gradle::$(echo "$line" | tr -d '\r' | cut -c1-900)"
          done
          exit 0

      - name: Rename APK
        if: success()
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -exec cp {} out/xlox-loader.apk \;
          ls -lh out/xlox-loader.apk

      # Proof of what actually ended up inside the APK, readable from the API
      # without downloading anything.
      - name: Audit the built APK
        if: success()
        id: audit
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          echo "::notice title=apk size::$(du -h out/xlox-loader.apk | cut -f1)"

          BADGING=$("$AAPT" dump badging "$APK")
          echo "::notice title=package::$(echo "$BADGING" | grep -m1 '^package:')"
          echo "::notice title=minSdk::$(echo "$BADGING" | grep -m1 'sdkVersion')"
          echo "::notice title=targetSdk::$(echo "$BADGING" | grep -m1 'targetSdkVersion')"

          PERMS=$("$AAPT" dump permissions "$APK" | grep -oE 'android\.permission\.[A-Z_]+|com\.[a-zA-Z0-9_.]+\.permission\.[A-Z_]+' | sort -u)
          echo "::notice title=permissions in the APK::$(echo "$PERMS" | tr '\n' ' ')"

          BAD=""
          for p in $PERMS; do
            # foreground-service *types* are capability labels, not real access
            case "$p" in *FOREGROUND_SERVICE_*) continue ;; esac
            for pat in $BLOCKED_PATTERNS; do
              case "$p" in
                *"$pat"*) BAD="$BAD $p" ;;
              esac
            done
          done
          if [ -n "$BAD" ]; then
            echo "::warning title=sensitive permissions still present::$BAD"
          else
            echo "::notice title=permissions::no camera/mic/location/SMS/contacts/calendar/bluetooth permissions in the APK ($(echo "$PERMS" | wc -l) declared)"
          fi

          if echo "$BADGING" | grep -q "targetSdkVersion:'$TARGET_SDK'"; then
            echo "::notice title=targetSdk check::targetSdk is $TARGET_SDK as requested"
          else
            echo "::warning title=targetSdk check::expected $TARGET_SDK, got $(echo "$BADGING" | grep -m1 targetSdkVersion)"
          fi

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xlox-loader-debug
          path: loader/out/xlox-loader.apk
          if-no-files-found: error

      # A GitHub Release gives a permanent download URL that never expires,
      # unlike the artifact (90 days, and requires being signed in).
      - name: Publish release with the APK
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/arena/38338797-kurrrrrro')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: loader-${{ github.run_number }}
          name: XLOX loader build ${{ github.run_number }}
          body: |
            Debug APK built from `${{ github.sha }}`.

            Compiled endpoint: **https://kuro-panel-psi.vercel.app**
            (license check → `/server`, lib version → `/api/version`, lib zip → `/api/download`)

            What is new in this build:
            - **Startup gate** — the lib is checked/downloaded before anything else is
              reachable, with automatic retries, a manual RETRY, REDOWNLOAD and
              RESTART, and no way past it until the update succeeded.
            - **OBB gate** — the main screen copies the game data first and only then
              offers LAUNCH, with progress, real error messages and a retry button.
            - Download is checksum-verified (sha256 from the panel) and rolled back on
              failure.
            - Permissions: ~113 were being merged in from the sandbox `.aar`
              (camera, mic, location, SMS, contacts, calendar, bluetooth, sensors…).
              72 of them are now stripped at merge time, so the install screen no
              longer asks for anything scary. What remains is the loader's own
              access (internet, network state, all-files access for the OBB) plus
              the sandbox SDK's internal plumbing (query packages, install into the
              sandbox, overlay, foreground service). The full list is printed by the
              audit step of every build.
            - targetSdk ${{ env.TARGET_SDK }} (Android 14 behaviour level).

            Install with `adb install xlox-loader.apk` or copy it to the phone.
            The APK is **debug-signed** — fine for testing, replace the keystore before selling it.
          files: loader/out/xlox-loader.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
