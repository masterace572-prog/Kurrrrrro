name: UI screenshots (real device)

# Boots a real Android emulator, installs the debug APK, walks through the
# screens and pushes the PNGs to the `ui-screenshots` branch so a design change
# can be looked at instead of guessed at.

on:
  workflow_dispatch:
    inputs:
      key:
        description: 'license key to log in with (a throwaway one)'
        required: false
        default: ''
  push:
    paths:
      - 'loader/app/src/main/res/layout/**'
      - 'loader/app/src/main/res/values/**'
      - 'loader/app/src/main/res/drawable/**'
      - 'loader/app/src/main/java/**'
      - '.github/workflows/ui-screenshots.yml'

jobs:
  shots:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the debug APK
        working-directory: loader
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PxloxTargetSdk=34

      - name: Boot the emulator and capture the screens
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # throwaway key used only to photograph the main screen; delete it from
          # the panel afterwards. Override with the workflow input when dispatching.
          PANEL_KEY: ${{ github.event.inputs.key || 'admin-24-SHOT2' }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            LOG=/tmp/steps.log
            note() { echo "::notice title=$1::$2" | tee -a $LOG; }
            : > $LOG
            note phase "install"
            adb install -r loader/app/build/outputs/apk/debug/app-debug.apk >> $LOG 2>&1 || note install-failed "adb install failed"
            adb shell appops set com.xlox MANAGE_EXTERNAL_STORAGE allow >> $LOG 2>&1 || true
            note phase "launch"
            adb shell am start -n com.xlox/.SplashActivity >> $LOG 2>&1 || true
            sleep 3
            adb exec-out screencap -p > shot-1-splash.png 2>>$LOG || true
            sleep 26
            adb exec-out screencap -p > shot-2-login.png 2>>$LOG || true
            note phase "login-screen"

            if [ -n "$PANEL_KEY" ]; then
              note phase "type-key"
              adb shell uiautomator dump /sdcard/ui.xml >> $LOG 2>&1 || true
              adb pull /sdcard/ui.xml ui.xml >> $LOG 2>&1 || true
              COORDS=$(python3 - <<'PY'
            import re, xml.etree.ElementTree as ET
            try:
                root = ET.parse('ui.xml').getroot()
            except Exception:
                print(''); raise SystemExit
            field = button = None
            for node in root.iter('node'):
                cls = node.get('class', '')
                text = node.get('text', '')
                bounds = re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', node.get('bounds', ''))
                if not bounds:
                    continue
                x1, y1, x2, y2 = map(int, bounds.groups())
                cx, cy = (x1 + x2) // 2, (y1 + y2) // 2
                if 'EditText' in cls and field is None:
                    field = (cx, cy)
                if node.get('clickable') == 'true' and 'Continue' in text:
                    button = (cx, cy)
            if field and button:
                print(field[0], field[1], button[0], button[1])
            PY
            )
              note coords "$COORDS"
              if [ -n "$COORDS" ]; then
                read FX FY BX BY <<< "$COORDS"
                adb shell input tap $FX $FY >> $LOG 2>&1 || true
                sleep 1
                adb shell input text "$PANEL_KEY" >> $LOG 2>&1 || true
                sleep 1
                adb shell input keyevent 111 >> $LOG 2>&1 || true
                sleep 1
                adb exec-out screencap -p > shot-3-typed.png 2>>$LOG || true
                adb shell input keyevent 4 >> $LOG 2>&1 || true   # hide the keyboard
                sleep 1
                adb exec-out screencap -p > shot-3b-typed.png 2>>$LOG || true
                adb shell input tap $BX $BY >> $LOG 2>&1 || true
                sleep 2
                adb exec-out screencap -p > shot-3c-verifying.png 2>>$LOG || true
                note phase "tapped-continue"
                sleep 5
                adb exec-out screencap -p > shot-4-gate.png 2>>$LOG || true
                sleep 15
                adb exec-out screencap -p > shot-5-main.png 2>>$LOG || true
                note phase "main-screen"
                adb shell uiautomator dump /sdcard/ui2.xml >> $LOG 2>&1 || true
                adb pull /sdcard/ui2.xml ui2.xml >> $LOG 2>&1 || true
              fi
            fi

            adb logcat -d >> logcat.txt 2>&1 || true
            grep -i "com.xlox" logcat.txt | tail -40 >> $LOG || true
            ls -l shot-*.png >> $LOG 2>&1 || true
            cp $LOG steps.log 2>/dev/null || true
            true

      - name: Publish the screenshots to the ui-screenshots branch
        if: always()
        run: |
          if ! ls shot-*.png >/dev/null 2>&1; then
            echo "::warning title=screenshots::the emulator produced no screenshots this run — dispatch the workflow again"
            exit 0
          fi
          git config user.name "Arena Agent"
          git config user.email "agent@arena.ai"
          git checkout --orphan ui-screenshots
          git reset
          mkdir -p ui
          cp shot-*.png ui/ 2>/dev/null || true
          cp logcat.txt ui/ 2>/dev/null || true
          cp steps.log ui/ 2>/dev/null || true
          cp ui.xml ui2.xml 2>/dev/null ui/ || true
          rm -f ui/ui.xml.pull 2>/dev/null || true
          git add ui
          git commit -m "UI screenshots from ${GITHUB_SHA}" || true
          git push -f origin ui-screenshots || echo "::warning title=screenshots::could not push the branch"

# rerun 13:32
