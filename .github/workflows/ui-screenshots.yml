name: UI screenshots (real device)

# Boots a real Android emulator, installs the debug APK, walks through the
# screens and pushes the PNGs to the `ui-screenshots` branch so a design change
# can be looked at instead of guessed at.

on:
  workflow_dispatch:
    inputs:
      key:
        description: 'license key to log in with (a throwaway one)'
        required: false
        default: ''
  push:
    paths:
      - 'loader/app/src/main/res/layout/**'
      - 'loader/app/src/main/res/values/**'
      - 'loader/app/src/main/res/drawable/**'
      - 'loader/app/src/main/java/**'
      - '.github/workflows/ui-screenshots.yml'

jobs:
  shots:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the debug APK
        working-directory: loader
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PxloxTargetSdk=34

      - name: Boot the emulator and capture the screens
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # throwaway key used only to photograph the main screen; delete it from
          # the panel afterwards. Override with the workflow input when dispatching.
          PANEL_KEY: ${{ github.event.inputs.key || 'admin-24-UIPRV' }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -x
            adb install -r loader/app/build/outputs/apk/debug/app-debug.apk
            # grant the storage access up front so the system dialog does not
            # cover the screens we want to photograph
            adb shell appops set com.xlox MANAGE_EXTERNAL_STORAGE allow || true
            adb shell am start -n com.xlox/.SplashActivity || true
            sleep 3
            adb exec-out screencap -p > shot-1-splash.png || true
            sleep 24
            adb exec-out screencap -p > shot-2-login.png || true
            # dismiss anything the system may have put in front
            adb shell input keyevent 4 || true
            sleep 2
            adb exec-out screencap -p > shot-2b-login.png || true

            if [ -n "$PANEL_KEY" ]; then
              # tap the field, type the key, tap Continue — coordinates read from
              # the live view hierarchy instead of being guessed
              adb shell uiautomator dump /sdcard/ui.xml >/dev/null
              adb pull /sdcard/ui.xml ui.xml >/dev/null
              read FIELD_X FIELD_Y BUTTON_X BUTTON_Y <<< "$(python3 - <<'PY'
            import re, xml.etree.ElementTree as ET
            root = ET.parse('ui.xml').getroot()
            field = button = None
            for node in root.iter('node'):
                cls = node.get('class', '')
                text = node.get('text', '')
                bounds = re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', node.get('bounds', ''))
                if not bounds:
                    continue
                x1, y1, x2, y2 = map(int, bounds.groups())
                cx, cy = (x1 + x2) // 2, (y1 + y2) // 2
                if 'EditText' in cls and field is None:
                    field = (cx, cy)
                if node.get('clickable') == 'true' and 'Continue' in text:
                    button = (cx, cy)
            print(*field, *button)
            PY
            )"
              adb shell input tap "$FIELD_X" "$FIELD_Y"
              sleep 1
              adb shell input text "$PANEL_KEY"
              sleep 1
              adb shell input keyevent 111   # dismiss the keyboard
              sleep 1
              adb shell input tap "$BUTTON_X" "$BUTTON_Y"
              sleep 6
              adb exec-out screencap -p > shot-3-gate.png || true
              sleep 14
              adb exec-out screencap -p > shot-4-main.png || true
              # the OBB card + launch button should be visible now
              adb shell uiautomator dump /sdcard/ui2.xml >/dev/null 2>&1 || true
              adb pull /sdcard/ui2.xml ui2.xml >/dev/null 2>&1 || true
              adb exec-out screencap -p > shot-5-main.png || true
            fi
            true

            adb logcat -d | tail -200 > logcat.txt
            ls -l shot-*.png || true

      - name: Publish the screenshots to the ui-screenshots branch
        if: always()
        run: |
          ls shot-*.png >/dev/null 2>&1 || { echo "::warning title=screenshots::nothing was captured"; exit 0; }
          git config user.name "Arena Agent"
          git config user.email "agent@arena.ai"
          git checkout --orphan ui-screenshots
          git reset
          mkdir -p ui
          cp shot-*.png ui/ 2>/dev/null || true
          cp logcat.txt ui/ 2>/dev/null || true
          git add ui
          git commit -m "UI screenshots from ${GITHUB_SHA}" || true
          git push -f origin ui-screenshots || echo "::warning title=screenshots::could not push the branch"
